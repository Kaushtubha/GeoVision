seed: 42
smoke: false

tracking:
  enabled: true
  experiment_name: "GeoVision"
  tracking_uri: "mlruns"
  log_models: true

detection:
  model_name: "yolov8n.pt"
  dataset_name: "nwpu_vhr10"
  num_classes: 10
  image_size: 512
  epochs: 50
  smoke_epochs: 1
  batch_size: 8
  learning_rate: 0.001
  confidence_threshold: 0.25
  iou_threshold: 0.5
  device: "cpu"
  save_dir: "weights/detection"

segmentation:
  architecture: "Unet"
  encoder_name: "mobilenet_v3_small"
  encoder_weights: "imagenet"
  dataset_name: "landcover_ai"
  num_classes: 5
  image_size: 512
  epochs: 30
  smoke_epochs: 1
  batch_size: 4
  learning_rate: 0.0003
  loss: "dice_ce"
  device: "cpu"
  save_dir: "weights/segmentation"

change:
  architecture: "SiameseUnet"
  encoder_name: "resnet18"
  encoder_weights: "imagenet"
  dataset_name: "levir_cd"
  num_classes: 2
  image_size: 256
  epochs: 25
  smoke_epochs: 1
  batch_size: 4
  learning_rate: 0.0003
  device: "cpu"
  save_dir: "weights/change"

retrieval:
  model_name: "ViT-B-32"
  pretrained: "openai"
  dataset_name: "eurosat"
  num_classes: 10
  embedding_dim: 512
  collection_name: "geovision_scenes"
  top_k: 5
  batch_size: 16
  qdrant_path: "data/qdrant_db"
  device: "cpu"

vlm:
  vlm_model_id: "Qwen/Qwen2-VL-2B-Instruct"
  quantization: "4bit"
  max_new_tokens: 512
  temperature: 0.1
  fallback_to_text_llm: true
  grounding_strictness: "strict"
