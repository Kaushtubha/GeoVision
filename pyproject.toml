[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geovision"
version = "0.1.0"
description = "Multimodal Satellite-Intelligence & Earth Observation Platform"
readme = "README.md"
authors = [
    { name = "Kaushtubha", email = "kaushtubha@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pillow>=10.2.0",
    "matplotlib>=3.8.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "mlflow>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "jupyter>=1.0.0",
]
cv = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "albumentations>=1.4.0",
    "ultralytics>=8.2.0",
    "segmentation-models-pytorch>=0.3.3",
    "open-clip-torch>=2.24.0",
    "qdrant-client>=1.9.0",
    "transformers>=4.40.0",
]
geo = [
    "rasterio>=1.3.9",
    "geopandas>=0.14.0",
]
serving = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]
all = [
    "geovision[dev,cv,geo,serving]"
]

[project.scripts]
geovision = "geovision.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["geovision*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "mlruns", "weights", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
